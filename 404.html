<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | Cozy Tidy Finds</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
    <style>
        body {
            background: var(--cream);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }
        .error-page {
            max-width: 480px;
            padding: 2rem;
        }
        .error-page .logo {
            font-family: var(--serif);
            font-size: 1.6rem;
            color: var(--navy);
            margin-bottom: 2rem;
        }
        .error-page h1 {
            font-family: var(--serif);
            font-size: 2rem;
            color: var(--navy);
            margin-bottom: 1rem;
        }
        .error-page p {
            color: var(--text-light);
            margin-bottom: 2rem;
            line-height: 1.7;
        }
        .error-page .btn-shop {
            display: inline-block;
            background: var(--sage);
            color: #fff;
            padding: 0.85rem 2rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: background 0.2s;
        }
        .error-page .btn-shop:hover {
            background: var(--sage-dark);
        }
    </style>
</head>
<body>
    <div class="error-page">
        <div class="logo">Cozy Tidy Finds</div>
        <h1>Oops, that page doesn't exist</h1>
        <p>The page you're looking for may have moved or doesn't exist yet.</p>
        <a href="/" class="btn-shop">Back to Home</a>
    </div>
</body>
</html>
