            - list [ref=e956]:
              - listitem [ref=e957]: ✔Make Everything Organized -- These clear versatile drawer dividers trays are perfect for any place in your home. Fit all kinds of drawers, such as vanity / bathroom / kitchen / office drawers/ craft room, ideal for organizing cosmetics, makeup tools, hair accessories, jewelry, pins, office supply, craft supplies, utensils, etc.
              - listitem [ref=e958]: "✔Combination of 4 Different Sizes -- One set includes 25pcs storage bins in 4 different sizes, which help you customize combinations to store items and organize drawer in shelf/ closet/ cabinet/ dresser . Includes: 9 x 6 x 2 inches (3pcs), 9 x 3x 2 inches(6pcs), 6 x 3 x 2 inches(8pcs), 3 x 3 x 2 inches(8cps)."
              - listitem [ref=e959]: ✔Non-Slip and Durable -- Extra 100pcs silicone pads are included, just stick them on the bottom of the plastic trays for non-slip. Made of durable and clear plastic, so you can see what’s in it without digging around or making a mess, help you get a neat lifestyle.
              - listitem [ref=e960]: ✔Stackable Storage -- The drawer bins can be stacked into one other when you not use them, that will save much space and organize well. You will find it's so easy to keep things neat and tidy.
              - listitem [ref=e961]: ✔Easy to Clean -- Our desk drawer storage bins are easy to be wiped clean with a damp cloth and perfect for keeping everything in its place. Convenient for use in your daily life, make everything look beautiful and better organized.
