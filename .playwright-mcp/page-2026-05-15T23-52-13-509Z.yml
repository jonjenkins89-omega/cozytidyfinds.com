                  - paragraph
                  - list [ref=e1751]:
                    - listitem [ref=e1752]:
                      - generic [ref=e1753]: Practical bedding, classic yet romantic. Chunky knit throw blankets can be used in all seasons. This chunky knit blanket throw can be folded on a bed horizontally, neatly at the foot, or really however you' d like.
                    - listitem [ref=e1754]:
                      - generic [ref=e1755]: Worth Putting On Decor Duty. Chunky knot knit blankets are always good for Beds, Sofas, Chairs, Stools and Benches. If you are looking for a statement piece to go on top of them, try this thick knit blanket, which has 'bulky' cable knit design, exaggerated chunky rope woven and super soft touching.
                    - listitem [ref=e1756]:
                      - generic [ref=e1757]: Light warmth for any member of the family. Chunky throw blanket knit may not be the warmest blanket for home, but it must be the perfect covering for an afternoon nap. The chunky knot blanket can quickly be spread out again in whatever arrangement one prefers after serving its purpose of providing warmth.
                    - listitem [ref=e1758]:
                      - generic [ref=e1759]: Best Gift for Your Lover. The giant knitted throw blanket will be a romantic yet practical birthday gift to the ones you loved! Exaggerated 'bulky' thick rope texture, boho chunky cable knit, chunky throw will also be a top gift for Housewarming, Christmas, Anniversary, Mother's Day.
