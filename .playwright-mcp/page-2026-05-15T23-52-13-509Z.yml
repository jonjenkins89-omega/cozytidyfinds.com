                      - generic [ref=e2753]:
                        - generic [ref=e2759]:
                          - text: "Update: we’ve been using these for over 6 months now and still love them. I only wish I could get this in king size for our bed. When we had to wash our usual king size comforter we threw these on the bed (one for each of us) and LOVED sleeping with these so much that we keep using them for our bed! We like them better than our high quality down duvet. I think it’s just the way they drape over our bodies. It’s like this comforting, snuggly, soft, warm (but not too hot) hug. Best purchase ever and we are both picky and have tried a lot of different types of blankets. If you’ve ever had a minky blanket for your child they feel kinda like that."
                          - text: Gorgeous, heavy, warm and well made. The brown color we chose is slightly purple and we found some throw pillow covers to match. No shedding, durable and machine washable. You won’t be disappointed. They (we bought two) are warm and feel so comforting; almost like a slightly weighted blanket. They conform well to your body and the yarn is baby soft too. They really add a lot of texture and style to our living room. We will have these for many years to come. I have tried my hand at crocheting and it’s not as easy as it looks. Plus, the yarn itself is worth the price. Good yarn isn’t cheap. If you’re used to buying cheaper throws consider this an investment that’s well worth the price.
