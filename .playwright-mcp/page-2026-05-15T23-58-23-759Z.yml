                        - text: First off, these are fantastic shelves. Look good, super sturdy, can hold lots of stuff, the hooks kinda snap on so they don’t move around every time you put something on or take it off. The only reason I took a star off is because removing the adhesive panels is a Herculean task. With a lot of effort, patience, strong nails, and possibly the loss of your fingerprints, you can take them both off in about 30 minutes. So if you’re in an apartment, don’t leave this till the last second or you WILL be panicking. Blow dryer didn’t help either, if anything it made the adhesive stick more. That said, am I buying a new set of adhesive strips for the apartment I’m moving into?
