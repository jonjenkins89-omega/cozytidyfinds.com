                      - generic [ref=e2348]:
                        - generic [ref=e2350]:
                          - text: I normally don't write reviews, but these shelves have treated me too well to not compliment them!
                          - text: I've had these shelves in my bathroom for the past 6 months, and they haven't budged. They've been consistently filled with large bottles of shampoo and conditioner and smaller random bottles, and despite us pushing down on the bottles to pump them, the shelves haven't bent nor come off of the walls. Also, there has been no lifting of the adhesive despite my scalding showers and our shower wall being less than perfectly glass-smooth. Also, there has been no chipping, peeling, or rust on our black shelves. I think they're well worth the money if you're willing to prep properly.
                          - text: I prepped the wall by cleaning any soap scum I could scrape off and then I used rubbing alcohol to prep the surface. I tried not to touch the cleaned portion of the wall to prevent any oil from my hands from transferring back onto the wall. I also used a dry erase marker to map out where I wanted to put the adhesive hook strips. When applying the strips, I tried to slowly lay down the strip from one edge to the other, pushing out as much air as possible. I also pushed a card over the adhesive strip to push out any remaining air bubbles out from under the strip. After that, I waited for 24 hours before putting the shelves onto the adhesive hooks and filling up the shelves.
                          - text: Hopefully, if you similarly prep the wall and if the wall isn't too textured, you'll be able to enjoy the shelves as we have!
