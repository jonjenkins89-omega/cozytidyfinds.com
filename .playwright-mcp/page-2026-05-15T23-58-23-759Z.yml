                        - generic [ref=e2191]:
                          - text: "***We’ve been using these for 3 days, I will update after a few months of use ***"
                          - text: So, I purchased 2 sets since my husband is the diva of the family and needed 2 shelves for all of his products, lol.
                          - text: Caveat, I didn’t know how these would adhere to our shower tile as it isn’t flat but rather a “wavy” or uneven shower tile. See last picture and you can see how I could not get 100% of the adhesive strip to lay flat but for now, it’s working fine.
                          - text: The gold color is pretty, especially against the navy blue colored tile.
                          - text: The hooks are nice to hang any razors, rags, sponges or brushes.
                          - text: The design of the shelves are attractive and a nice finish.
                          - text: They seem sturdy and are large enough to hold large bottles of shampoos/conditioners.
                          - text: I did make sure to clean the tile first and wipe the tiles with rubbing alcohol to make sure everything was super clean for the adhesive to stick well.
                          - text: I love these shelves and I really hope they last!
                          - text: If the gold starts wearing off, my plan is to try some gold leaf rub and buff and see how that works but hopefully it won’t come to that.
                          - text: Good value for my money!
                          - text: Super easy to install. I did wait 24 hours per the instructions after the installation before I added my bottles of products or added weight, giving time for the adhesion to “cure or set”.
                          - text: So many ways you could use these shelves…not necessarily strictly for a shower as the bottom is wide enough to perhaps just to sit on your vanity or shelf to hold your items, so versatile to me.
