                      - generic [ref=e3184]: Such a great purchase! (And on sale to boot -- I just bought a second set.) The shelves/drawers seem to be robust and good quality, and the organizer seems solid overall. I wasn't sure about the supporting spindles, but it doesn't wobble at all, even when pulling out a drawer. I used to keep things under the sink organized in small bins, but it was such a hassle when I needed something, as I essentially had to pull everything out to get what I wanted and then had to restack all the bins when I put them back under the sink. The Delamu 2-Tier Organizer completely removes that inconvenience. Everything is visible and easily accessible. I had to reconfigure the set-up due to the position of the plumbing, but the three level and single level work beautifully for me. I purchased the clear set because, not only do I like the "clean" look of it, but it also allows me to see through the shelves to what is underneath and/ or behind. Overall, I am completely satisfied with this purchase. If you're looking for a way to organize your under sink chaos, you won't be disappointed with this purchase.
