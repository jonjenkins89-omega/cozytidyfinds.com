              - listitem [ref=e742]: Under Sink Organizer
              - listitem [ref=e743]: "Available in 2 Different Sizes: The smaller size (S) measures 8.27\" x 13.19\" x 9.06\", and the larger size (L) measures 8.27\" x 13.19\" x 10.63\". High-Low combos make this bathroom organizer versatile for multi-purpose storage and organization, such as kitchen organization, cabinet organizer and storage, bathroom organizer countertop, pantry organizer, under sink organizer, etc"
              - listitem [ref=e744]: "Pull-Out Drawers and Divider: This kitchen organization and storage set come with 4 slide-out drawers and 8 movable dividers. Each drawer can slide in and out smoothly, making it a breeze to access hard-to-reach things. The movable divider allows you to freely adjust the spacing as you like to organize your meds, cosmetics, stationery, skincare, perfume, brushes, etc"
              - listitem [ref=e745]: "Upgraded Clear Acrylic Organizers: The kitchen cabinet organizer are Selected with high-end acrylic, aluminum alloy support rod, etc high-quality materials to Produce, so you can see the inside clearly and find the wanted stuff fast, An essential assistant for bathroom organization, and kitchen organizer and pantry storage, keeping toiletries and kitchen seasoning organized"
              - listitem [ref=e746]: "Stackable Pantry Storage Organizer: What sets this pull out cabinet organizer apart is that you can stack 3 at a time according to space needs, which means it is a must-have space saver! it is very useful for organizing to hold spice jars, medicines bottles, beverages, canned goods, grab-and-go snacks, and even a variety of health/beauty aides, and small items"
              - listitem [ref=e747]: "Anti-slip Durable and Convenient: We provide non-slip silicone stoppers at every base to prevent the bathroom countertop organizer from moving around, even when pulling out a drawer. The 8 support rods are made of rust-proof and durable aluminum alloy for long-lasting use. Assembly is easy - simply connect the bottom base and upper drawers with the 4 rods"
