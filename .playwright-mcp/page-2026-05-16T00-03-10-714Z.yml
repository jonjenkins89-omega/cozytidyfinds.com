                      - generic [ref=e2743]: These are incredible! Very well made, very sturdy and easy to assemble. I thought they would be flimsy since it's basically flat plastic at first but they're very structured. They're so strong that I even put a wood shelf and a storage box on them and they're completely unbothered. They make the bottom of my closet look so nice and keep my shoes from getting dusty and unorganized. The height is a little short for high heels so I put them sideways which is not a problem at all. In some boxes I even have a couple pairs of sandals/flip flops/sneakers as they're pretty spacious. RECOMMEND THIS 10/10. You won't regret.
