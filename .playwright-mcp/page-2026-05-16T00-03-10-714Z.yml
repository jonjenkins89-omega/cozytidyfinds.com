                      - generic [ref=e2539]:
                        - generic [ref=e2541]:
                          - text: First, look at the price. The picture you see is fully assembled and of course it makes it look nicer than it actually is. You are not going to get 12 high end solid already assembled rigid plastic storage bins with easy open fronts. Also, these do not slide out.
                          - text: These are mass produced sheets of strong plastic that come completely flat made to expand into a shape of a box. So these are flexible and only rigid once the ends are assembled. Assembly is required and requires a bit of patience on the first one.
                          - text: In saying that, shoes should not require a strong storage box and these work fine unless you plan to use it every day all the time. I would recommend for storage & not for repeated use by many people. For shoes being used daily, I'd recommend something else or just use a regular shoe rack.
                          - text: Many styles of shoes will stand up straight in the box, but high heels may have to be turned sideways. I have also used for baseball caps as well.
                          - text: Assembly. It is very SIMPLE but patience is required! Expand the plastic sheets and make it form a box shape. Bend inward all tabs on both ends. Position the back onto one end and click in one side, then use your hands to guide the edges into the back, click in sides. Repeat for other end, paying attention to which way you want the little door to open. First few were slow, then it was easy from there on out.
                          - text: You have 12 to do so you might want to do a few of the same movements at the same time, or get someone to help.
                          - text: These will stack. You must push out the stacking tabs. The box on top has tabs on the bottom to slide into the top sides of box below to make it sturdy.
                          - text: Is this high end? No. Use care when opening the little door.
                          - text: Does it work well in the top of a closet? Yes. It took a lot of clutter and organized it very well, off the floor and into spaces we were not using.
                          - text: We bought another set for out closet so for what it is, we recommend it.
