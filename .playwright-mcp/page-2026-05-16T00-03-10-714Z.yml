                      - generic [ref=e2439]:
                        - generic [ref=e2441]:
                          - text: "I gave this product 5 stars because it accomplished what I wanted to accomplish for a favorable price compared to research I’ve done on similar products. So for me, it works. For people interested in this product and reading reviews, I want to be helpful:"
                          - text: "Assembly: Requires patience, especially on the first couple. Not for those who easily get frustrated. While trying to assemble the first box, I thought for sure I would returning but I stuck with it, and they got easier as I went on. Took me an hour to assemble the 12 boxes and stack as shown in the pictures."
                          - text: "Display: If you are looking to “display” your prized sneaker or heals collection, this is not the product as you can see from my images. The clear boxes are not so clear as you can see. Theres a cross web likely for sturdiness. Again, this was okay with me because I was simply trying to protect my shoes, and get them stacked rather the taking up space on the floor."
                          - text: "Size: After opening the box and seeing the door size, I thought for sure I’d have to return. I missed the top to bottom size when determining whether or not to purchase, but it’s clearly in the product images, and it’s only 6” for the XL version (5” for the regular). My highest sneaks are Jordan 4s. These JUST fit and I had to put them in sideways through the door, then flip upright. I am not sure how tall high heals go, but take note if you wear them. My Timberlands and Nike ACGs will not fit in these."
                          - text: "Takeaways: If you want to display your shoe collection, this is not for you. If you have shoes or sneakers over 6” tall, this is not for you. If you want to protect your shoes/sneakers completely, be able to stack them to save floor space, and are willing to take the time to assemble, this is a great cost effective solution."
