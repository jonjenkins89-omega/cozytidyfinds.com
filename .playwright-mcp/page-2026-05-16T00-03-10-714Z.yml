                      - generic [ref=e2784]: Je suis surprise de la qualité du produit et de sa durabilité. Même si le plastique de la boîte apparaît mince, il est particulièrement solide et la transparence permet de voir les souliers ce qui est très pratique. Par ailleurs, le système pour faire le montage des boites est super facile même s’il faut quelques minutes pour figurer comment ça fonctionne. J’ai fait plusieurs recherches pour choisir ce système de rangement et je dois dire que le prix est raisonnable comparativement aux autres items identiques trouvés sur le site Amazon. Je suis très satisfaite du rapport qualité-prix. Important de savoir cependant que les boites « medium » ne permettent pas de mettre des souliers à talons hauts debout dans la boîte. Il faut alors les mettre de position couchée mais comme on dit, ça fait la job. À acheter de nouveau sans hésitations.
