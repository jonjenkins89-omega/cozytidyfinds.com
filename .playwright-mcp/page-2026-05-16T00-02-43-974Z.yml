                        - text: I was accumulating King sized pillow like a hoarder & decided to do something about it, so I got these bags. 2 King pillows fit nicely into a bag, all you need is a vacuum and Voila! The ziplock-like double seal was a bit difficult for me to line up, but I eventually got the hang of it, and the rest is history. It's been at least a week since I vacuumed all the air out of the bags and they are still holding strong.
