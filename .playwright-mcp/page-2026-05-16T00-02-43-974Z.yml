                      - generic [ref=e2275]: I'm so glad i got these for my move. The medium size is prefect for my needs including twin and queen size bedding. I dont know how many uses ill get but so far they seem well made and the zips are strong and not horribly annoying and impossible to seal. The main reason i wanted to leave this review though was for my fellow MCS people or anybody who is just super annoyed or sickened by the presence of smells/perfumed fragrance in practically everything these days. These bags i was SHOCKED and overjoyed to find, do not have a perfume smell or a particularly strong prastic/chemical smell. yaay! i honestly couldnt believe it. i am very sensitive to these smells and so i figured i was going to have to figure out a way to not let them contaminate my clothes for example (because often these odors transfer) but happily it was no issue. THANK YOU to the company and I hope they never change that!
