                      - generic [ref=e2615]:
                        - generic [ref=e2617]:
                          - text: These bags are really, really good. I have only used 2 so far, one for clothes just to test it, and the other to store a thick, duck down kingsize duvet. The duvet was a struggle to fit in the bag but once it was in, the little zipper thing to seal it was really easy to use and fast.
                          - text: The vent on the bag has a one way valve so you don't have to worry about air getting back in to it once you have vacuumed it out. When using the pump, it screws in place making a brilliant seal.
                          - text: I started to use the included pump which it was clear would take absolutely hours to get all the air out. I didn't want to get the hoover out as one of the main reasons to buy this is to use at the caravan where we don't take the hoover.
                          - text: I had the brain wave of unsealing the bag to squeeze some air out. It did occur to me that i might break the bag using this method but then I remembered the '100% money back guarantee' in the description. So I opened up the side of the seal. There are 2 seal strips which both work really well, after opening an inch or so I was worried that the seals might split open along the seam but with most of my 16 stone weight on the bag pushing the air out of the little split I had made I am happy to say the seals didn't open any more and the bag showed no signs of splitting.
                          - text: They really are made very well. Once I was sure I had as much air out as I could, I resealed the top and set about attaching the pump again, but again, got sick of using it. The pump is just too small, but its free so i am not marking it down.
                          - text: I got out the hoover... well... dyson and noticed there is a little thumb button on the end of my hoover tube to attach accessories to so I could not get a perfect seal on the bag vent thing, however this was not too much a problem as it was still working very effectively. I got as much air out as I could then fitted the pump on again to get the last out and it was clear when there was little air left in the bag. The pump got stiff to use.
                          - text: I would definately recommend this product.
