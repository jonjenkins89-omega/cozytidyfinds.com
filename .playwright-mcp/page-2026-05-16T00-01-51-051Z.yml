                      - generic [ref=e2339]:
                        - text: I ordered this product for basic cable management and didn't need all of the pieces that it came with. That said, it's nice to have extra items for cable management on hand, especially for a price under $20. The price and amount of items you get for managing cables is extremely value-friendly. That said, some of the adhesive materials hardly stick with thicker power cords.
                        - text: When attempting to stick a clip onto a metal desk support, and insert a power cord into the clip, it constantly fell off. Eventually I used another clip[ that came in the package, but this happened again and it gave me a "you get what you pay for" type of feeling. If you have issues with the adhesive, grab some double-sided tape or thin pads. The other products worked fine and at the end of the day, I had a cleaner desk setup without dangling cords.
