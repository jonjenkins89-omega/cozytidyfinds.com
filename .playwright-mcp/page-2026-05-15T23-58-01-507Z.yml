                      - generic [ref=e2335]:
                        - generic [ref=e2337]:
                          - text: I bought this caddy tray back in January, have used it 6-7 times, and it still looks brand new. The craftsmanship is beyond belief, and the price can't be beat, especially for this kind of quality!
                          - text: The owner of the family-owned company reached out to me a number of times to follow-up and ask me about my experience with his product. I typically ignore emails from vendors, but his persistence and dedication to his customers is too admirable to ignore. The company's mission is to provide the highest quality, hand-crafted products, and if you have any grievances with the final product, they will personally find a solution for you.
                          - text: The caddy is adjustable, and will fit most bathtubs. There are 2 detachable trays, one on each end, that are convenient because they are easier to wash than the entire tray should any of the items on your caddy make a mess. The biggest differentiator is the removable waterproof back for the book/tablet stand. It's nice to be able to protect tablet or papers from the water. However, if you do not need to use the stand, being able to remove the waterproof back saves space and leaves the center console clear and fully functional (without the cover blocking the slots/space).
