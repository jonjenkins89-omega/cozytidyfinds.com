            - separator [ref=e751]
            - heading "About this item" [level=1] [ref=e752]
            - list [ref=e753]:
              - listitem [ref=e754]: "✅ 𝐏𝐄𝐑𝐒𝐎𝐍𝐀𝐋𝐈𝐙𝐄 𝐘𝐎𝐔𝐑 𝐁𝐀𝐓𝐇 𝐄𝐗𝐏𝐄𝐑𝐈𝐄𝐍𝐂𝐄: Create your own at home spa day with this cost effective bathtub caddy tray that can be used to hold all your favorite personal items to enhance your bath time experience. Enjoy a warm, luscious bath as the spa tray conveniently holds your soap, bubble bath, bath salts, aromatherapy candle, wine glass, smartphone, tablet, book, & more. Everything is easily within arm’s reach, held securely in place by built-in holders & slots specifically for your essentials."
              - listitem [ref=e755]: "✅ 𝐄𝐗𝐏𝐀𝐍𝐃𝐀𝐁𝐋𝐄 𝐅𝐎𝐑 𝐓𝐇𝐄 𝐏𝐄𝐑𝐅𝐄𝐂𝐓 𝐅𝐈𝐓: No need to worry about breaking out the measuring tape and try to figure out the right dimensions. Our bathtub tray takes all the guesswork out of it so you can get straight to enjoying your next bubble bath, conveniently expanding from 29½ inches to 43 inches to fit even the widest tubs, allowing you additional room for more bathroom accessories, making it handy for when you want to enjoy a luxurious bath for two."
              - listitem [ref=e756]: ✅ 𝐒𝐋𝐈𝐏 𝐑𝐄𝐒𝐈𝐒𝐓𝐀𝐍𝐓, 𝐖𝐀𝐓𝐄𝐑 𝐑𝐄𝐒𝐈𝐒𝐓𝐀𝐍𝐓:Crafted with your peace of mind as our biggest priority, the Royal Craft Wood expandable bamboo bathtub caddy features non-slip silicone grips on its underside so it remains securely in place, without you having to worry about it tipping over and spilling your important personal items, phone, or tablet into the water. Coated with a specially formulated varnish, the bathtub reading tray is water resistant to protect from water damage or wear from splashing.
              - listitem [ref=e757]: "✅ 𝐂𝐋𝐀𝐒𝐒𝐈𝐂 𝐁𝐀𝐓𝐇𝐑𝐎𝐎𝐌 𝐃𝐄𝐂𝐎𝐑: Not your average bathroom organizer, this wooden bath tray for tub is more than just functional. Its unique design and one of a kind craftsmanship makes it a timeless bathroom decor piece. Made from renewable materials, sustainably sourced bamboo offers a sleek, elegant, minimalist, natural and classic look that will blend in perfectly with any bathroom setting. Available in a variety of color options, there's something to suit everyone's personal style."
              - listitem [ref=e758]: "✅ 𝐅𝐎𝐋𝐃𝐀𝐁𝐋𝐄, 𝐄𝐀𝐒𝐘 𝐓𝐎 𝐒𝐓𝐎𝐑𝐄: If you live in a big city, chances are, you’re short on storage space. Every item you buy is just contributing to endless piles of stuff that don’t seem to ever have a home. Don’t worry! This must-have bath accessory is collapsible in design! The bath caddy tray for tub neatly folds in half, making it easy to carry around or store. You won’t have to struggle to find space after use, as it will conveniently slide into any available corner of your bathroom or linen closet."
              - listitem [ref=e759]: "✅ 𝐏𝐄𝐑𝐅𝐄𝐂𝐓 𝐌𝐎𝐓𝐇𝐄𝐑𝐒 𝐃𝐀𝐘 𝐆𝐈𝐅𝐓: Foldable Bathtub Tray – an expandable bath caddy designed to elevate any self-care routine. Whether it’s for Mothers Day Gifts for Mom, a Mother’s Day Gift for a loved one, or a Mother Birthday Gift, this elegant bamboo tray transforms any bathtub into a personal spa. With room for wine, candles, books, and essentials, it’s the ultimate relaxation accessory."
              - listitem [ref=e760]: "✅ 𝐌𝐎𝐍𝐄𝐘-𝐁𝐀𝐂𝐊 𝐖𝐀𝐑𝐑𝐀𝐍𝐓𝐘: Our brand is committed to providing our customers the best possible support and satisfaction. That’s why we offer a comprehensive customer support program with a 1-year warranty, a money-back guarantee, and 24/7 customer support. We understand the importance of standing behind our products and ensuring our customers are delighted"
