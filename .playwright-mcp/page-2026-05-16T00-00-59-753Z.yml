                      - generic [ref=e3040]: I initially purchased this to hang on my bedroom door to store my shoes; being in a small apartment without a closet, I didn't have many storage options. I found it held my shoes just fine (I'm a women's size 7 mostly). I recently moved to a larger apartment and did not need it to store my shoes, but found I didn't have much room in my bathroom cabinet under my sink, so now I'm using it on my bathroom door to store my hair products and various other toiletries, for which it works great. I do wish there was a way to secure the bottom of the organizer to the door because every time I go to shut the door it pulls away from the organizer and when the organizer catches up to the door it makes a small thump against the door every time. It also of course looks kind of tacky but I actually like being able to see everything in one place and I have easy access to any needed products. It has been sturdy enough thus far and the pockets are perfectly see-through. For the purposes it has served, it is a solid product that I would recommend if you are lacking storage space in your bedroom or bathroom.
